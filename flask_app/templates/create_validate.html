<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Authentication</title>
    <style>
        form {
            width: fit-content;
            height: fit-content;
            text-align: center;
            background-color: rgb(205, 255, 248);
            display: flex;
            flex-direction: column;
            margin: auto;
            margin-top: 30px;
            padding: 10px;
        }

        input {
            width: 30vw;
            height: 20px;
            margin: 3px;
        }

        button {
            width: 100px;
            padding: 3px;
            border-radius: 3px;
            background-color: greenyellow;
        }
    </style>
</head>
<body>
    <form action="{{ url_for('news_validate_submit') }}" method="post">
        <input type="text" name="name" placeholder="Name" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Enter</button>
    </form>
</body>
</html>
