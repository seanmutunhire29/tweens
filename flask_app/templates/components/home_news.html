<article class="group relative overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm transition hover:-translate-y-1 hover:shadow-xl" data-reveal>
    <div class="h-44 bg-cover bg-center" style="background-image: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.6)), url('{{ update_img_url }}');"></div>
    <div class="space-y-4 p-5">
        <div class="flex items-center justify-between">
            <span class="rounded-full bg-slate-100 px-3 py-1 text-[10px] font-semibold uppercase tracking-wider text-slate-600">{{ update.category or 'General' }}</span>
            <span class="text-xs text-slate-400">{{ (update.published_at or update.created_at) | format_date }}</span>
        </div>
        <h3 class="text-lg font-semibold text-slate-900">{{ update_title }}</h3>
        <p class="text-sm text-slate-600">{{ update.excerpt or update.caption }}</p>
        <a href="{{ full_news }}" class="inline-flex items-center gap-2 text-sm font-semibold text-brand-blue">
            View update
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </a>
    </div>
</article>
